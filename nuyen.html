<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư Mời - Lam</title>
    <link rel="stylesheet" href="style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;1,600&display=swap"
        rel="stylesheet">
    <style>
        body {
            background-color: var(--color-cream, #f9f6f0);
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Container lo việc di chuyển bồng bềnh lên xuống */
        .poster-wrapper {
            animation: slideUpFade 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards,
                floatPoster 4s ease-in-out infinite alternate 1.2s;
            opacity: 0;
            transform: translateY(50px) scale(0.95);
            z-index: 2;
        }

        @keyframes slideUpFade {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes floatPoster {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(-8px);
            }
        }

        /* Container lo việc phóng to khi di chuột vào (hover) */
        .poster-scale-container {
            position: relative;
            transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .poster-wrapper:hover .poster-scale-container {
            transform: scale(1.02);
        }

        .poster-bg {
            height: 95vh;
            width: auto;
            display: block;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 25px 60px rgba(74, 94, 42, 0.25);
        }

        /* Phần chứa chữ */
        .link-container {
            position: absolute;
            top: 10.5%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            align-items: center;
            white-space: nowrap;
            opacity: 0;
            animation: fadeInLink 1s ease forwards 1s;
        }

        @keyframes fadeInLink {
            to {
                opacity: 1;
            }
        }

        .static-text {
            font-family: var(--font-body, 'Be Vietnam Pro', sans-serif);
            color: #525c24;
            font-weight: 900;
            font-size: 1.2rem;
            margin-right: 6px;
        }

        .special-link {
            font-family: var(--font-body, 'Be Vietnam Pro', sans-serif);
            color: #525c24;
            font-weight: bold;
            text-decoration: underline;
            font-size: 1.2rem;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: inline-block;
            background: rgba(255, 255, 255, 0.5);
            padding: 2px 10px;
            border-radius: 6px;
            position: relative;
        }

        .special-link:hover {
            color: #3a4e1e;
            background: rgba(255, 255, 255, 0.95);
            transform: scale(1.15) rotate(-3deg);
            box-shadow: 0 4px 15px rgba(82, 92, 36, 0.3);
            text-decoration: none;
        }

        /* --- CSS CHO CÁC HẠT TRANG TRÍ --- */
        #particles-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            opacity: 0;
            animation: floatParticle linear infinite;
        }

        @keyframes floatParticle {
            0% {
                transform: translateY(110vh) rotate(0deg) scale(0.5);
                opacity: 0;
            }

            10% {
                opacity: 0.7;
            }

            90% {
                opacity: 0.7;
            }

            100% {
                transform: translateY(-10vh) rotate(360deg) scale(1.2);
                opacity: 0;
            }
        }
    </style>
</head>

<body>
    <!-- Container cho các hạt trang trí -->
    <div id="particles-container"></div>

    <div class="poster-wrapper">
        <!-- Đặt một container bọc ngoài cả ảnh và chữ để chúng phóng to CÙNG NHAU -->
        <div class="poster-scale-container">
            <img class="poster-bg" src="letter.png" alt="Thư mời của Lâm">
            <div class="link-container">
                <a href="https://www.instagram.com/un2512_/" class="special-link">un2512_</a>
                <span class="static-text">TỚI</span>
            </div>
        </div>
    </div>

    <!-- Script tạo hạt trang trí -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const colors = ['#4a5e2a', '#c8b98c', '#6a7e3a', '#e8e0d0', '#576d33'];
            const container = document.getElementById('particles-container');
            const particleCount = 35;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');

                const size = Math.random() * 8 + 4;
                const color = colors[Math.floor(Math.random() * colors.length)];
                const left = Math.random() * 100;
                const duration = Math.random() * 12 + 10;
                const delay = Math.random() * -20;

                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.backgroundColor = color;
                particle.style.left = `${left}vw`;
                particle.style.animationDuration = `${duration}s`;
                particle.style.animationDelay = `${delay}s`;

                if (Math.random() > 0.7) {
                    particle.style.borderRadius = "2px";
                }

                container.appendChild(particle);
            }
        });
    </script>
</body>

</html>
